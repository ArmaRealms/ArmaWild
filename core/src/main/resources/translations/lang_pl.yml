# For when an RTP action is denied such as trying to rtp in a world that does not allow rtp.
#   <reason> - The reason the action was denied.
not-permitted-generic: 'Nie można użyć losowej teleportacji. Powód: <reason>'
# For when an RTP action is denied because an issue occurred. Ex: an exception occurs while waiting for an rtp location.
#   <reason> - The message from the exception that caused this message to appear.
#   Note: This is always followed in console by a stack trace (which can not be configured)
not-permitted-major-error: 'Wystapił błąd, przez co nie można teleportować. Powód: <reason> <newline>Sprawdź konsolę, by dowiedzieć się, co to powoduje.'
# For when the reason an action is denied is that rtp is not enabled in the world.
#   <code> - An identifier that helps with debugging
not-enabled-in-this-world: 'Losowa teleportacja jest wyłączona w tym świecie. <code>'
# For no rtpSettings are found with a given name
#   <profile> - The given name
no-settings-found-with-name: 'Nie znaleziono ustawień losowej teleportacji z nazwą <profile>.'
# For when a player does not have permission to use the rtpSettings with the given name
# <permission> - The permission node that was required to use the rtpSettings
no-permission: "You do not have permission <permission> to use RTP settings"
# For no rtpSettings are found with a given name WHEN SEARCHED BY A SPECIFIC PLAYER
# This will both be displayed when the rtpSettings with the given name do not exist, or the player who ran
#   the `/rtp <settingsName>` command did not have permission to use the settings found.
#   <profile> - The given name
no-settings-found-with-name-for-player: 'Nie znaleziono ustawień losowej teleportacji z nazwą <profile>'
# For when too many attempts are made by the plugin to find a point with no success.
too-many-failed-attempts: 'Za dużo nieudanych prób teleportacji.'
# For any time the plugin expects a player's name but does not receive the name of a player.
#   <player> - The name given that did not match a player.
player-not-found: 'Nie znaleziono gracza o nicku <player>'
# For when a world name is expected but not received.
#   <world> - The given name that matched no world names.
world-not-found: 'Nie znaleziono świata o nazwie <world>'
# For when a given rtpSettings is expected to contain the given world, but does not.
#   <profile> - The rtpSetting's name
#   <world> - The world's name
rtp-settings-no-contain-world: 'Błąd: RtpSettings "<profile>" nie zawiera świata "<world>" jako jednego z włączonych.'
# For when a given rtpSettings can only land people in one world but another world is requested instead.
#   <profile> - The rtpSetting's name
#   <world> - The only valid world name
rtp-settings-must-use-world: 'Błąd: RtpSettings "<profile>" może teleportować jedynie graczy ze świata "<world>"'
# For when a player needs to wait for a cooldown before running the command again.
#   <time> - The cooldown time (uses READABLE-TIME as defined below)
need-to-wait-for-cooldown: 'Za szybko! Musisz poczekać jeszcze: <time>'
# For when a player is waiting  for the warmup before teleporting. (Only gets used if `warmup.time` is greater than 0)
#   <seconds> - The number of seconds remaining
teleporting-in-x-seconds: 'Teleportowanie za <seconds> sekund...'
# For when a player walks during their rtp warmup canceling it. (Only gets used if `warmup.time` is greater than 0)
moved-during-warmup: 'Wykryto ruch, losowa teleportacja anulowana.'
# For when a player is waiting on the warmup and calls `/rtp` again. (Only gets used if `warmup.time` is greater than 0)
rtp-called-while-in-warmup: 'Już czekasz na losową teleportację!'
# For when something costs money, but the player does not have enough.
#   <cost> - The cost
#   <balance> - The player's balance
not-enough-money: 'Nie masz na to pieniędzy! Masz <balance>, a potrzebujesz <cost>.'
# For when the player had enough money to run the command, but does not have enough by the time they get charged.
# This will only really happen if a player tries to get around paying by emptying their balance before the warmup is over.
no-longer-enough-money: 'Już nie masz na to pieniędzy.'
# For when a player is charged.
#   <amount> - The amount charged
#   <balance> - The amount they player has left
you-were-charged-x: 'Pomyślnie zapłaciłeś <amount>'
# For when an economy error happens. This will most likely not occur.
#   <error> - The economy error text.
economy-error: 'Wystąpił błąd ekonomii: <error>'
cooldown-over: 'Twój cooldown RTP dla "<profile>" zakończył się.'
# READABLE-TIME - This is a special case message. Whenever a time needs to be displayed, it will use this for
#   formatting. Also, each 'word' will only be displayed if the associated number value is greater than 0.
# Example: 8675 seconds will be formatted as such: `2 hours, 24 minutes, 35 seconds.` Note the absence of days.
readable-time: '<days><hours><minutes><seconds>'
readable-time-word-days: '<amount> dni, '
readable-time-word-hours: '<amount> godzin, '
readable-time-word-minutes: '<amount> minut, '
readable-time-word-seconds: '<amount> sekund.'
