# All settings related to language and the content of messages will be in this file.
# Currently supported languages:
#  • English (en)
#  • Español (es)
#  • Íslenska (is)
#  • Magyar (hu)
#  • Polskie (pl)
#  • Português (pt)
# Note: You MUST type the letters in the parentheses
language: 'en'

# - - - - - - - - - - -
# ~ MESSAGE OVERRIDES ~
# All configurable messages sent by the plugin will appear in the `lang_en` file (and eventually in all other language
#   files as well), and any message that is stored in the language file can be overridden here. To override a message,
#   just add the existing key of the message from the original language file, and set the value to whatever message you
#   would like. A list of all messages can be found here:
#   https://github.com/donvi-bz/JakesRTP/blob/master/Core/src/main/resources/translations/lang_en.yml
# Notes on formatting:
#   All messages use MiniMessage: <gray>, <#00FFC8>, <bold>, <click:...>, <hover:...>.
#   Use <newline> for a line break. Written \n is also supported.
#   Use named placeholders documented in lang_en.yml, such as <time>, <cost> and <player>.
#   Replace old numbered placeholders and legacy colors in existing overrides.
# Finally, if you know another language and would like to help translate this plugin, you can copy the `lang_en.yml`
#   file found here https://github.com/donvi-bz/JakesRTP/tree/master/Core/src/main/resources/translations then
#   translate the new language and make a PR. Or you could send me the file another way. Either way, if you do this,
#   thank you so much. ♥

need-to-wait-for-cooldown: '<yellow>Whoops! You still have to wait <time></yellow>'

# Paid RTP shows a native Paper dialog (no command runs on Cancel / Escape).
# Override these keys to customize its title, body and buttons using MiniMessage.
# <cost> and <profile> are inserted literally; neither can inject formatting tags.
# confirm-rtp-dialog-title: '<gold>Confirmar teleporte</gold>'
# confirm-rtp-dialog-body: '<gray>O teleporte para <profile> custa <cost>. Deseja confirmar?</gray>'
# confirm-rtp-dialog-accept: '<green>Confirmar</green>'
# confirm-rtp-dialog-cancel: '<red>Cancelar</red>'
